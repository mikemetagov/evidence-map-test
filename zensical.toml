[project]
site_name = "Blockchain for Impact Funding Evidence Map"
site_description = "Evidence on how blockchain changes the delivery and governance of impact funding."
copyright = "Text and data CC BY 4.0 · Code MIT · Metagov"
extra_css = ["assets/css/site.css"]
extra_javascript = ["assets/js/evidence-map.js"]
nav = [
  { "Home" = "index.md" },
  { "Evidence map" = [
      { "Explore the map" = "map/index.md" },
      { "EPPI-Mapper version" = "map/eppi.md" },
  ] },
  { "Findings and outputs" = "outputs/index.md" },
  { "Data" = "data/index.md" },
  { "Methods" = "methods/index.md" },
  { "Changelog" = "changelog.md" },
  { "About and citation" = "about.md" },
]

[project.theme]
language = "en"
features = [
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.path",
  "navigation.sections",
  "navigation.tabs",
  "navigation.top",
  "search.highlight",
  "toc.follow",
]

[project.theme.icon]
logo = "lucide/grid-3x3"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/moon"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/sun"
toggle.name = "Switch to light mode"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.details = {}
pymdownx.superfences = {}
